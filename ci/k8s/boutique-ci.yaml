apiVersion: v1
kind: Namespace
metadata:
  name: boutique-ci
  labels:
    app.kubernetes.io/part-of: online-boutique
    environment: ci
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: boutique-ci
  labels:
    app.kubernetes.io/part-of: online-boutique
automountServiceAccountToken: false
---
# The Jenkins controller (SA jenkins/jenkins) provisions agent pods in boutique-ci.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-controller-agents
  namespace: boutique-ci
  labels:
    app.kubernetes.io/part-of: online-boutique
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "events", "configmaps", "secrets", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-controller-agents
  namespace: boutique-ci
  labels:
    app.kubernetes.io/part-of: online-boutique
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-controller-agents
  apiGroup: rbac.authorization.k8s.io
