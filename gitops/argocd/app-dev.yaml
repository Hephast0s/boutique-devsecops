apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: online-boutique
    environment: dev
spec:
  project: boutique
  source:
    repoURL: https://github.com/Hephast0s/boutique-devsecops.git
    targetRevision: devsecops
    path: gitops/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
