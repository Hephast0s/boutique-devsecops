apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-policies
  namespace: argocd
  labels: {app.kubernetes.io/part-of: online-boutique}
spec:
  project: boutique
  source:
    repoURL: https://github.com/Hephast0s/boutique-devsecops.git
    targetRevision: main
    path: gitops/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-security
  syncPolicy:
    automated: {prune: true, selfHeal: false}
