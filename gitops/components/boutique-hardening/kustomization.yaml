apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Shared homelab hardening applied to every boutique environment.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext/seccompProfile
        value:
          type: RuntimeDefault
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1part-of
        value: online-boutique
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: worker
      # Homelab probe tolerance: the 1s gRPC probe is too tight on a busy small cluster.
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        value: 3
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
        value: 6
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 3
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
        value: 6

  # Replace the LoadBalancer with ClusterIP; ingress is the entry point (avoids node port-80 conflict).
  - target:
      version: v1
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP

  # ── Right-sized resources ────────────────────────────────────────────────────────────────
  # Requests set near measured idle/steady usage; limits ~2–3x measured peak for burst headroom.
  # Measured peaks (1h): adservice 97Mi, cartservice 71Mi, currency 45Mi, email 41Mi, payment 44Mi,
  # recommendation 35Mi, frontend 17Mi, mailpit 14Mi, productcatalog/shipping 11Mi, checkout 10Mi,
  # redis 7Mi; CPU ~1–6m per pod. This frees cluster reservation without starving bursts.
  - target: {group: apps, version: v1, kind: Deployment, name: adservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "50m", memory: "128Mi"}, limits: {cpu: "300m", memory: "256Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: cartservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "25m", memory: "64Mi"}, limits: {cpu: "200m", memory: "192Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: checkoutservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "10m", memory: "32Mi"}, limits: {cpu: "150m", memory: "96Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: currencyservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "15m", memory: "48Mi"}, limits: {cpu: "150m", memory: "128Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: emailservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "15m", memory: "48Mi"}, limits: {cpu: "150m", memory: "128Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: frontend}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "15m", memory: "32Mi"}, limits: {cpu: "150m", memory: "96Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: paymentservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "15m", memory: "48Mi"}, limits: {cpu: "150m", memory: "128Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: productcatalogservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "10m", memory: "32Mi"}, limits: {cpu: "150m", memory: "96Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: recommendationservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "25m", memory: "64Mi"}, limits: {cpu: "200m", memory: "192Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: redis-cart}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "15m", memory: "32Mi"}, limits: {cpu: "100m", memory: "96Mi"}}
  - target: {group: apps, version: v1, kind: Deployment, name: shippingservice}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "10m", memory: "32Mi"}, limits: {cpu: "150m", memory: "96Mi"}}
