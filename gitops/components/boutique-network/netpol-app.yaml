# Explicit allow policies per the Online Boutique call graph.
# Same-namespace peers use podSelector; the ingress controller lives in kube-system.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app: productcatalogservice}}}]
      ports: [{protocol: TCP, port: 3550}]
    - to: [{podSelector: {matchLabels: {app: currencyservice}}}]
      ports: [{protocol: TCP, port: 7000}]
    - to: [{podSelector: {matchLabels: {app: cartservice}}}]
      ports: [{protocol: TCP, port: 7070}]
    - to: [{podSelector: {matchLabels: {app: recommendationservice}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{podSelector: {matchLabels: {app: shippingservice}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{podSelector: {matchLabels: {app: checkoutservice}}}]
      ports: [{protocol: TCP, port: 5050}]
    - to: [{podSelector: {matchLabels: {app: adservice}}}]
      ports: [{protocol: TCP, port: 9555}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: checkoutservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: checkoutservice}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: frontend}}}]
      ports: [{protocol: TCP, port: 5050}]
  egress:
    - to: [{podSelector: {matchLabels: {app: productcatalogservice}}}]
      ports: [{protocol: TCP, port: 3550}]
    - to: [{podSelector: {matchLabels: {app: currencyservice}}}]
      ports: [{protocol: TCP, port: 7000}]
    - to: [{podSelector: {matchLabels: {app: cartservice}}}]
      ports: [{protocol: TCP, port: 7070}]
    - to: [{podSelector: {matchLabels: {app: shippingservice}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{podSelector: {matchLabels: {app: paymentservice}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{podSelector: {matchLabels: {app: emailservice}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: recommendationservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: recommendationservice}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: frontend}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app: productcatalogservice}}}]
      ports: [{protocol: TCP, port: 3550}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cartservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: cartservice}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: frontend}}
        - podSelector: {matchLabels: {app: checkoutservice}}
      ports: [{protocol: TCP, port: 7070}]
  egress:
    - to: [{podSelector: {matchLabels: {app: redis-cart}}}]
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redis-cart, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: redis-cart}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: cartservice}}}]
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: productcatalogservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: productcatalogservice}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: frontend}}
        - podSelector: {matchLabels: {app: checkoutservice}}
        - podSelector: {matchLabels: {app: recommendationservice}}
      ports: [{protocol: TCP, port: 3550}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: currencyservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: currencyservice}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: frontend}}
        - podSelector: {matchLabels: {app: checkoutservice}}
      ports: [{protocol: TCP, port: 7000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: shippingservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: shippingservice}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: frontend}}
        - podSelector: {matchLabels: {app: checkoutservice}}
      ports: [{protocol: TCP, port: 50051}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: paymentservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: paymentservice}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: checkoutservice}}}]
      ports: [{protocol: TCP, port: 50051}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emailservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: emailservice}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: checkoutservice}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    # local Mailpit sink
    - to: [{podSelector: {matchLabels: {app: mailpit}}}]
      ports: [{protocol: TCP, port: 1025}]
    # real SMTP delivery (Google/Gmail) — restricted to Google's published IP ranges (not 0.0.0.0/0)
    - to:
        - ipBlock: {cidr: 64.233.160.0/19}
        - ipBlock: {cidr: 66.102.0.0/20}
        - ipBlock: {cidr: 66.249.80.0/20}
        - ipBlock: {cidr: 72.14.192.0/18}
        - ipBlock: {cidr: 74.125.0.0/16}
        - ipBlock: {cidr: 108.177.0.0/17}
        - ipBlock: {cidr: 142.250.0.0/15}
        - ipBlock: {cidr: 142.251.0.0/16}
        - ipBlock: {cidr: 172.217.0.0/19}
        - ipBlock: {cidr: 172.253.0.0/16}
        - ipBlock: {cidr: 173.194.0.0/16}
        - ipBlock: {cidr: 209.85.128.0/17}
        - ipBlock: {cidr: 216.239.32.0/19}
        - ipBlock: {cidr: 216.58.192.0/19}
      ports: [{protocol: TCP, port: 587}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: adservice, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: adservice}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: frontend}}}]
      ports: [{protocol: TCP, port: 9555}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mailpit, labels: {app.kubernetes.io/part-of: online-boutique}}
spec:
  podSelector: {matchLabels: {app: mailpit}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: emailservice}}}]
      ports: [{protocol: TCP, port: 1025}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: TCP, port: 8025}]
