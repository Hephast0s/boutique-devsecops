apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev environment. Built on upstream kustomize/base; images remapped to Harbor and PINNED BY DIGEST.
namespace: boutique-dev

resources:
  - ../../../kustomize/base
  - namespace.yaml
  - ingress.yaml
  - mailpit.yaml

components:
  - ../../../kustomize/components/container-images-registry
  - ../../../kustomize/components/without-loadgenerator
  - ../../components/boutique-hardening

# Pin every image to an immutable digest in Harbor (threat R-01 / control C-PIN).
images:
  - name: CONTAINER_IMAGES_REGISTRY/adservice
    newName: 192.168.1.8:30082/boutique/adservice
    digest: sha256:f580c4853e896dd2083f0c270c4b7aa5feda6dd56058a93b87d0c88334a4c07d
  - name: CONTAINER_IMAGES_REGISTRY/cartservice
    newName: 192.168.1.8:30082/boutique/cartservice
    digest: sha256:b5c29ddb3238474ea8d1842f07004fedeeae47f660627ab111a613a681cd0356
  - name: CONTAINER_IMAGES_REGISTRY/checkoutservice
    newName: 192.168.1.8:30082/boutique/checkoutservice
    digest: sha256:ab40699b6d9e45c9a93b5427008f327fbe912465361e2ff7a1a1be7111e36134
  - name: CONTAINER_IMAGES_REGISTRY/currencyservice
    newName: 192.168.1.8:30082/boutique/currencyservice
    digest: sha256:7b2f3f804555c926861d67cd22c1b7c9e32d46b81cf1a64dd3089ae424d73be9
  - name: CONTAINER_IMAGES_REGISTRY/emailservice
    newName: 192.168.1.8:30082/boutique/emailservice
    digest: sha256:acaa03ca379b2e398a5d9e2a8c52d08e3e2f2d727e794b2416f57f0cd74074f1
  - name: CONTAINER_IMAGES_REGISTRY/frontend
    newName: 192.168.1.8:30082/boutique/frontend
    digest: sha256:c06df08eccd78568a37292cfbe889df42fac48691b7fb05f2deeba0ae8d669ef
  - name: CONTAINER_IMAGES_REGISTRY/paymentservice
    newName: 192.168.1.8:30082/boutique/paymentservice
    digest: sha256:735b6d3255e2c74b0135a95cfc2337987e492f24e163c0bb9a853635876993c4
  - name: CONTAINER_IMAGES_REGISTRY/productcatalogservice
    newName: 192.168.1.8:30082/boutique/productcatalogservice
    digest: sha256:fb8568ecfc948717eb07746a6ce360fb8e5f906ae8a874cbad666891f0d21790
  - name: CONTAINER_IMAGES_REGISTRY/recommendationservice
    newName: 192.168.1.8:30082/boutique/recommendationservice
    digest: sha256:5d8321f2d24132889f654f75308e541b0626e6ae0cbacf81b170e5eb0921b415
  - name: CONTAINER_IMAGES_REGISTRY/shippingservice
    newName: 192.168.1.8:30082/boutique/shippingservice
    digest: sha256:8527bafff8c8776e345f2dca0641f6e8595b053ce67f9a5af66f5a85d9eaca9d
  - name: CONTAINER_IMAGES_REGISTRY/redis
    newName: 192.168.1.8:30082/boutique/redis
    digest: sha256:9c3ecc609a8087c0f11c494fefaf37a8f7bf9a967631d4a0da8967a9810be354

# Declare replica counts explicitly so Argo enforces them (drift self-heal).
replicas:
  - {name: adservice, count: 1}
  - {name: cartservice, count: 1}
  - {name: checkoutservice, count: 1}
  - {name: currencyservice, count: 1}
  - {name: emailservice, count: 1}
  - {name: frontend, count: 1}
  - {name: paymentservice, count: 1}
  - {name: productcatalogservice, count: 1}
  - {name: recommendationservice, count: 1}
  - {name: shippingservice, count: 1}
  - {name: redis-cart, count: 1}

# Point emailservice at the local Mailpit SMTP sink (non-GCP email delivery).
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: emailservice
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SMTP_HOST, value: smtp.gmail.com}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SMTP_PORT, value: "587"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SMTP_TLS, value: "1"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SMTP_FROM, value: kazbar2002@gmail.com}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: smtp-eso
              key: username
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smtp-eso
              key: password
