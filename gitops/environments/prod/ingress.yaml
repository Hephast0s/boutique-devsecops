apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boutique-frontend
  labels:
    app.kubernetes.io/part-of: online-boutique
    environment: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: boutique-prod.192.168.1.8.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
