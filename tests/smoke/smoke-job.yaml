# Smoke test as a Kubernetes Job (usable as an Argo CD PostSync hook).
# NOTE: batch pods have no natural probes; `exec` probes are declared so the pod satisfies the
# boutique-require-probes Kyverno policy. A NetworkPolicy allows egress to `frontend` + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smoke-egress
  labels:
    app.kubernetes.io/part-of: online-boutique
spec:
  podSelector:
    matchLabels:
      app: smoke
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: batch/v1
kind: Job
metadata:
  name: boutique-smoke
  labels:
    app.kubernetes.io/part-of: online-boutique
    app: smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: online-boutique
        app: smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: 192.168.1.8:30082/boutique/smoke@sha256:ce8e655b562cf387752de7d2076ec3f81a4383c908f386b6724ec3571ce08b4a
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              BASE=http://frontend:80
              CJ=/tmp/cj; rm -f $CJ
              [ "$(curl -s -o /dev/null -w '%{http_code}' $BASE/_healthz)" = "200" ] || { echo "healthz FAIL"; exit 1; }
              [ "$(curl -s -o /dev/null -w '%{http_code}' -c $CJ $BASE/)" = "200" ] || { echo "home FAIL"; exit 1; }
              PID=$(curl -s -b $CJ $BASE/ | grep -oE '/product/[A-Z0-9]+' | head -1 | cut -d/ -f3)
              [ "$(curl -s -o /dev/null -w '%{http_code}' -b $CJ -c $CJ $BASE/product/$PID)" = "200" ] || { echo "product FAIL"; exit 1; }
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -b $CJ -c $CJ -X POST --data "product_id=$PID&quantity=1" $BASE/cart)
              [ "$CODE" = "302" ] || { echo "addtocart FAIL ($CODE)"; exit 1; }
              curl -s -b $CJ -c $CJ -X POST --data 'currency_code=EUR' $BASE/setCurrency >/dev/null
              OUT=$(curl -s -b $CJ -c $CJ -X POST --data-urlencode 'email=smoke@example.com' --data-urlencode 'street_address=1 S' --data-urlencode 'zip_code=1' --data-urlencode 'city=C' --data-urlencode 'state=S' --data-urlencode 'country=EG' --data-urlencode 'credit_card_number=4111111111111111' --data-urlencode 'credit_card_expiration_month=12' --data-urlencode 'credit_card_expiration_year=2030' --data-urlencode 'credit_card_cvv=123' $BASE/cart/checkout)
              echo "$OUT" | grep -q 'Your order' || { echo "checkout FAIL"; exit 1; }
              echo "SMOKE OK"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          livenessProbe:
            exec: {command: ["true"]}
            initialDelaySeconds: 5
          readinessProbe:
            exec: {command: ["true"]}
            initialDelaySeconds: 3
          resources:
            requests: {cpu: "50m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
      volumes:
        - name: tmp
          emptyDir: {}
